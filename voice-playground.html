<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>JBIQ — Voice (moved)</title>
<meta http-equiv="refresh" content="0; url=/components-overview.html#voice-home">
<script>
  // Map old voice-playground hashes (e.g. #greeting-open) to the new
  // prefixed ids on the consolidated site (e.g. #voice-greeting-open).
  (function () {
    var old = (location.hash || '').replace(/^#/, '');
    var target = old ? ('voice-' + old) : 'voice-home';
    location.replace('/components-overview.html#' + target);
  })();
</script>
</head>
<body>
<p>Voice has moved to <a href="/components-overview.html#voice-home">/components-overview.html#voice-home</a>.</p>
</body>
