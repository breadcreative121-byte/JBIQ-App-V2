<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <link rel="icon" type="image/svg+xml" href="assets/logo.svg">
  <title>JBIQ Conversation Playground</title>
  <!-- Canonical component system — tokens, fonts, primitives shared across all JBIQ surfaces. -->
  <link rel="stylesheet" href="components.css">
  <style>
    :root {
      --font-family: 'JioType', 'JioTypeVar', -apple-system, BlinkMacSystemFont, sans-serif;
      --frame-width: 360px;
      --frame-height: 780px;

      /* Tokens mirrored from index.html so the in-frame conversation surface
         renders identically to the real app, not a bespoke playground bubble. */
      --text-high: #0c0d10;
      --text-low: #191b1e;
      --surface-bold: #6d17ce;
      --surface-subtle: #ede7ff;
      --shape-pill: 999px;
    }

    *, *::before, *::after { box-sizing: border-box; }
    html, body { margin: 0; padding: 0; }
    body {
      font-family: var(--font-family);
      background: var(--color-surface-tertiary);
      color: var(--color-text-primary);
      line-height: var(--font-line-height-normal);
      -webkit-font-smoothing: antialiased;
      padding-left: 280px;
      padding-right: 460px;
    }

    /* ========================================================================
       PAGE LAYOUT — mirrors place-playground.html: left rail / centre stage /
       right rail. Centred via .page align-items.
       ======================================================================== */
    .page {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: var(--space-lg);
      padding: var(--space-xl) var(--space-md) var(--space-xxl);
    }

    .page__title {
      font-size: var(--font-size-title);
      font-weight: var(--font-weight-bold);
      line-height: var(--font-line-height-tight);
      color: var(--color-text-primary);
      margin: 0 0 var(--space-xs);
      letter-spacing: var(--font-tracking-headline);
      padding: 0 var(--space-md);
    }
    .page__subtitle {
      font-size: var(--font-size-caption);
      font-weight: 400;
      line-height: 1.35;
      color: var(--color-text-secondary);
      margin: 0;
      padding: 0 var(--space-md);
    }
    .page__canonical-link {
      font-size: var(--font-size-caption);
      margin: var(--space-xs) 0 0;
      padding: 0 var(--space-md);
    }
    .page__canonical-link a {
      color: var(--color-action-primary);
      text-decoration: none;
      font-weight: var(--font-weight-medium);
    }
    .page__canonical-link a:hover { text-decoration: underline; }

    .page__title-block {
      position: fixed;
      top: 0; left: 0; bottom: 0;
      width: 280px;
      background: var(--color-surface-primary);
      border-right: 0.5px solid var(--color-border-default);
      padding: var(--space-lg) var(--space-sm);
      display: flex;
      flex-direction: column;
      gap: var(--space-md);
      z-index: 10;
      overflow-y: auto;
      scrollbar-width: none;
    }
    .page__title-block::-webkit-scrollbar { display: none; }

    .toc-brand {
      display: flex;
      align-items: center;
      gap: var(--space-sm);
      padding: var(--space-sm) var(--space-md);
      margin-bottom: var(--space-md);
      text-decoration: none;
      color: inherit;
    }
    .toc-brand__mark { width: 28px; height: 28px; display: block; flex-shrink: 0; }
    .toc-brand__name {
      font-size: var(--font-size-title);
      font-weight: var(--font-weight-bold);
      letter-spacing: var(--font-tracking-headline);
    }

    /* Picker (left rail) */
    .picker { display: flex; flex-direction: column; gap: var(--space-md); margin-top: var(--space-sm); }
    .picker__group { display: flex; flex-direction: column; gap: 2px; }
    .picker__group-label {
      font-size: 10px;
      font-weight: var(--font-weight-bold);
      text-transform: uppercase;
      letter-spacing: 0.08em;
      color: var(--color-text-tertiary);
      padding: var(--space-xs) var(--space-md) var(--space-xs);
    }
    .picker__btn {
      font-family: inherit;
      font-size: 13px;
      font-weight: 500;
      text-align: left;
      padding: 8px var(--space-md);
      border: 0;
      background: transparent;
      color: var(--color-text-secondary);
      cursor: pointer;
      border-radius: var(--radius-sm);
      width: calc(100% - var(--space-sm));
      margin: 0 var(--space-xs);
      transition: background 120ms ease, color 120ms ease;
    }
    .picker__btn:hover { background: var(--color-surface-tertiary); color: var(--color-text-primary); }
    .picker__btn[aria-pressed="true"] {
      background: var(--color-action-primary-surface);
      color: var(--color-action-primary);
      font-weight: 600;
    }

    /* ========================================================================
       STAGE — phone frame with header / transcript / input
       ======================================================================== */
    .stage {
      position: relative;
      width: var(--frame-width);
    }
    /* ------------------------------------------------------------------------
       Phone frame + chrome (header, transcript, input bar) — mirrors index.html
       so each conversation specimen renders on the exact same surface the user
       would see in production. Tokens above (--text-high, --surface-bold, etc.)
       come from index.html, not components.css.
       ------------------------------------------------------------------------ */
    .frame {
      width: var(--frame-width);
      height: var(--frame-height);
      border-radius: 30px;
      background: #fff;
      box-shadow: 0 8px 28px rgba(12,13,16,0.08);
      overflow: hidden;
      display: flex;
      flex-direction: column;
    }

    /* Header — in-chat .voice-header: back chevron, conversation summary
       title, new-chat icon on the right. 24px top padding gives breathing
       room above the navigation, same as index.html's .voice-header where it
       sits below a (hidden) iOS status bar. */
    .frame__header {
      flex-shrink: 0;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 24px 16px 10px 12px;
      background: #fff;
    }
    .frame__header-start {
      display: flex;
      align-items: center;
      gap: 4px;
      flex: 1;
      min-width: 0;
    }
    .frame__back, .frame__new-chat {
      width: 32px; height: 32px;
      display: flex; align-items: center; justify-content: center;
      border-radius: var(--shape-pill);
      background: none; border: none;
      flex-shrink: 0;
    }
    .frame__back svg, .frame__new-chat svg, .frame__new-chat img { width: 20px; height: 20px; }
    .frame__title {
      font-size: 14px;
      font-weight: 700;
      color: var(--text-high);
      line-height: 1.2;
      flex: 1;
      min-width: 0;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    /* Transcript — white background, plain text assistant turns, grey-pill user
       bubbles right-aligned. Mirrors .ai-response + .user-bubble in index.html. */
    .frame__transcript {
      flex: 1;
      overflow-y: auto;
      padding: 8px 18px 16px;
      display: flex;
      flex-direction: column;
      gap: 12px;
      background: #fff;
    }
    .frame__transcript::-webkit-scrollbar { width: 0; }
    .frame__context {
      font-size: 11px;
      color: rgba(12,13,16,0.5);
      text-align: center;
      padding: 6px 10px;
      margin: 4px auto 4px;
      letter-spacing: 0.02em;
    }

    .turn--user {
      align-self: flex-end;
      max-width: 80%;
      background: #f5f5f5;
      border-radius: 24px 24px 0 24px;
      padding: 12px 16px;
      font-size: 14px;
      color: var(--text-high);
      line-height: 1.3;
      overflow-wrap: anywhere;
    }
    .turn--jbiq {
      align-self: flex-start;
      width: 100%;
      max-width: none;
      padding: 8px 0;
      background: transparent;
      color: var(--text-high);
      font-size: 16px;
      line-height: 1.3;
    }
    .turn strong { font-weight: 700; }

    /* Turn attachment — a card primitive (e.g. .receipt) rendered directly
       beneath a JBIQ turn. Sits at full transcript width and reads as part
       of the same beat as the preceding bubble. */
    .turn-attachment {
      width: 100%;
      margin: -4px 0 4px;
    }
    .turn-attachment .receipt {
      padding: var(--space-md) var(--space-lg);
      background: var(--color-surface-secondary);
      border-radius: var(--radius-lg);
      gap: 0;
    }
    .turn-attachment .receipt-partner { padding-top: 0; }
    .turn-attachment .receipt-banner {
      padding-top: 0;
    }

    /* Input bar — mirrors .home-input-bar in index.html: + button, grey pill,
       purple "Speak" button with animated waveform. */
    .frame__input {
      flex-shrink: 0;
      display: flex;
      gap: 6px;
      align-items: flex-end;
      padding: 8px 16px 18px;
      background: #fff;
    }
    .frame__add {
      width: 42px; height: 42px;
      background: #ede7ff;
      border-radius: var(--shape-pill);
      display: flex; align-items: center; justify-content: center;
      border: 0;
      cursor: pointer;
      flex-shrink: 0;
    }
    .frame__add svg { width: 26px; height: 26px; }
    .frame__input-pill {
      flex: 1;
      min-width: 0;
      background: #eeeeef;
      border-radius: 24px;
      display: flex;
      align-items: center;
      padding: 6px 16px;
      gap: 8px;
      height: 42px;
      font-size: 16px;
      color: rgba(12,13,16,0.45);
      line-height: 1.3;
    }
    /* Live mode — a real editable input that matches the pill exactly, with an
       inline send arrow that appears when there's text (like .text-pill). */
    .frame__input-pill--live { cursor: text; }
    .frame__input-field {
      flex: 1;
      min-width: 0;
      box-sizing: border-box;
      background: none;
      border: 0;
      outline: 0;
      padding: 0;
      font-family: var(--font-family);
      font-size: 16px;
      color: var(--text-high);
      line-height: 1.3;
    }
    .frame__input-field::placeholder { color: rgba(12,13,16,0.45); }
    .frame__send {
      width: 32px; height: 32px;
      background: var(--surface-bold);
      border-radius: var(--shape-pill);
      display: none; align-items: center; justify-content: center;
      border: 0; cursor: pointer; flex-shrink: 0;
    }
    .frame__send svg { width: 20px; height: 20px; }
    .frame__input--has-text .frame__send { display: flex; }

    /* "Speak" button — purple pill, animated waveform + label. */
    .frame__speak {
      height: 42px;
      padding: 0 16px;
      background: #6d17ce;
      border-radius: var(--shape-pill);
      display: inline-flex; align-items: center; justify-content: center; gap: 2px;
      border: 0; cursor: pointer; flex-shrink: 0;
      overflow: hidden;
      transition: max-width 300ms cubic-bezier(0.22,0.61,0.36,1),
                  opacity 200ms ease, padding 300ms cubic-bezier(0.22,0.61,0.36,1),
                  margin-left 300ms cubic-bezier(0.22,0.61,0.36,1);
      max-width: 160px;
    }
    .frame__speak svg { width: 26px; height: 26px; flex-shrink: 0; }
    .frame__speak-label {
      font-size: 14px; font-weight: 700; line-height: 1.2; color: #fff;
    }
    /* Speak collapses when the user types — the send arrow takes over. */
    .frame__input--has-text .frame__speak {
      max-width: 0; opacity: 0; padding-left: 0; padding-right: 0; margin-left: -6px;
      pointer-events: none;
    }
    .frame__speak svg rect:nth-child(1) { animation: voiceBar1 1.2s ease-in-out infinite; transform-origin: center; }
    .frame__speak svg rect:nth-child(2) { animation: voiceBar2 1.2s ease-in-out 0.2s infinite; transform-origin: center; }
    .frame__speak svg rect:nth-child(3) { animation: voiceBar3 1.2s ease-in-out 0.4s infinite; transform-origin: center; }
    @keyframes voiceBar1 { 0%,100% { height: 8px; y: 9; } 50% { height: 14px; y: 6; } }
    @keyframes voiceBar2 { 0%,100% { height: 16px; y: 5; } 50% { height: 8px; y: 9; } }
    @keyframes voiceBar3 { 0%,100% { height: 12px; y: 7; } 50% { height: 16px; y: 5; } }

    /* Live turns carry model output verbatim — preserve its line breaks. */
    .turn--live.turn--jbiq { white-space: pre-wrap; }

    /* Thinking row — mirrors .thinking-row in index.html: thinking-avatar video
       + shimmering "Thinking..." text. Shown while a reply is in flight. */
    .thinking-row {
      display: flex;
      align-items: center;
      gap: 6px;
      width: 100%;
      padding: 6px 2px;
      align-self: flex-start;
    }
    .thinking-avatar {
      position: relative;
      display: inline-block;
      width: 32px; height: 32px;
      overflow: hidden;
      flex-shrink: 0;
    }
    .thinking-avatar video {
      position: absolute; top: 3px; left: 3px;
      width: 25px; height: 25px;
      object-fit: cover;
      pointer-events: none;
    }
    .thinking-text {
      font-size: 14px; color: var(--text-low); opacity: 0.65; line-height: 1.3;
      background: linear-gradient(90deg, var(--text-low) 25%, #999 50%, var(--text-low) 75%);
      background-size: 200% 100%;
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      animation: shimmerText 2s ease-in-out infinite;
    }
    @keyframes shimmerText {
      0% { background-position: 200% 0; }
      100% { background-position: -200% 0; }
    }

    .stage__footnote {
      font-size: 11px;
      color: var(--color-text-tertiary);
      text-align: center;
      max-width: var(--frame-width);
      line-height: 1.5;
    }

    /* ========================================================================
       RIGHT RAIL — state caption / principles inspector
       ======================================================================== */
    .state-caption {
      position: fixed;
      top: 0; right: 0; bottom: 0;
      width: 460px;
      padding: var(--space-xl) var(--space-xxl);
      background: var(--color-surface-primary);
      border-left: 0.5px solid var(--color-border-default);
      font-family: var(--font-family);
      overflow-y: auto;
      scrollbar-width: none;
      z-index: 10;
    }
    .state-caption::-webkit-scrollbar { display: none; }
    .state-caption__eyebrow {
      font-size: 11px;
      font-weight: var(--font-weight-bold);
      color: var(--color-text-secondary);
      letter-spacing: 0.08em;
      text-transform: uppercase;
      margin: 0 0 var(--space-xs);
    }
    .state-caption__title {
      font-size: var(--font-size-title);
      font-weight: var(--font-weight-medium);
      line-height: var(--font-line-height-normal);
      letter-spacing: var(--font-tracking-body);
      color: var(--color-text-primary);
      margin: 0 0 var(--space-lg);
    }
    .state-caption__panels {
      display: flex;
      flex-direction: column;
      gap: var(--space-md);
    }
    .state-caption__panel {
      background: var(--color-surface-primary);
      border: 0.5px solid var(--color-border-default);
      border-radius: var(--radius-md);
      overflow: hidden;
    }
    .state-caption__panel--avoid { background: var(--color-surface-secondary); }
    .state-caption__panel-head {
      padding: var(--space-sm) var(--space-md);
      border-bottom: 0.5px solid var(--color-border-default);
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .state-caption__panel-title {
      font-size: 11px;
      font-weight: var(--font-weight-bold);
      text-transform: uppercase;
      letter-spacing: 0.08em;
      color: var(--color-text-primary);
    }
    .state-caption__panel-tag {
      font-size: 10px;
      font-weight: var(--font-weight-bold);
      text-transform: uppercase;
      letter-spacing: 0.08em;
      color: var(--color-text-tertiary);
    }
    .state-caption__panel--avoid .state-caption__panel-tag { color: #b3261e; }
    .state-caption__panel-body {
      padding: var(--space-md);
      font-size: var(--font-size-caption);
      color: var(--color-text-primary);
      line-height: 1.55;
    }
    .state-caption__panel-body em {
      font-style: normal;
      color: var(--color-text-secondary);
    }

    /* ========================================================================
       PLAYGROUND CHROME — axis toggle, acceptance counter (left rail)
       ======================================================================== */
    .axis-toggle {
      display: flex;
      gap: 2px;
      margin: 0 var(--space-xs) var(--space-xs);
      background: var(--color-surface-tertiary);
      border-radius: var(--radius-sm);
      padding: 2px;
    }
    .axis-toggle__btn {
      flex: 1;
      font-family: inherit;
      font-size: 11px;
      font-weight: 600;
      padding: 6px 4px;
      border: 0;
      background: transparent;
      color: var(--color-text-secondary);
      cursor: pointer;
      border-radius: calc(var(--radius-sm) - 2px);
    }
    .axis-toggle__btn[aria-pressed="true"] {
      background: var(--color-surface-primary);
      color: var(--color-text-primary);
      box-shadow: 0 1px 2px rgba(12,13,16,0.06);
    }
    .picker__counter {
      font-size: 10px;
      font-weight: 700;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      color: var(--color-text-tertiary);
      padding: var(--space-xs) var(--space-md);
    }
    .picker__counter strong { color: var(--color-action-primary); }
    .picker-filter {
      font-family: inherit;
      font-size: 13px;
      width: calc(100% - var(--space-sm));
      margin: 0 var(--space-xs) var(--space-xs);
      padding: 8px var(--space-md);
      border: 0.5px solid var(--color-border-default);
      border-radius: var(--radius-sm);
      background: var(--color-surface-tertiary);
      color: var(--color-text-primary);
      outline: none;
      box-sizing: border-box;
    }
    .picker-filter:focus { border-color: var(--color-action-primary); }
    .picker-filter::placeholder { color: var(--color-text-tertiary); }
    .picker__empty {
      font-size: 12px;
      color: var(--color-text-tertiary);
      padding: var(--space-sm) var(--space-md);
    }

    /* ========================================================================
       RIGHT-RAIL BADGES — chapter / intent / commitment / surface / etc.
       ======================================================================== */
    .badges {
      display: flex;
      flex-wrap: wrap;
      gap: 4px;
      margin: 0 0 var(--space-lg);
    }
    .badge {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      font-size: 10px;
      font-weight: 700;
      letter-spacing: 0.04em;
      text-transform: uppercase;
      padding: 3px 8px;
      border-radius: var(--shape-pill);
      background: var(--color-surface-secondary);
      color: var(--color-text-secondary);
      border: 0.5px solid var(--color-border-default);
      white-space: nowrap;
    }
    .badge--chapter { background: var(--color-action-primary); color: #fff; border-color: transparent; }
    .badge--intent  { background: #eef4ff; color: #1f5fd6; border-color: #d6e4ff; }
    .badge--commit  { background: #fff3e6; color: #b5650f; border-color: #ffe0bf; }
    .badge--auth    { background: #fde8ef; color: #b3175a; border-color: #f8cfde; }
    .badge--surface { background: #e8f7f0; color: #0a7a52; border-color: #c8ecdd; }
    .badge--fail    { background: var(--color-feedback-error-bg); color: var(--color-feedback-error-text); border-color: var(--color-feedback-error-border); }
    .badge--strategy{ background: #f0ecff; color: #5b21b6; border-color: #e0d7ff; }
    .badge--warn    { background: #fdecc8; color: #92560a; border-color: #f6d488; }

    /* Panel inner layouts (reuse .state-caption__panel chrome) */
    .panel-rows { display: flex; flex-direction: column; gap: var(--space-sm); }
    .kv { display: grid; grid-template-columns: 92px 1fr; gap: var(--space-sm); font-size: var(--font-size-caption); }
    .kv__k { color: var(--color-text-secondary); }
    .kv__v { color: var(--color-text-primary); font-weight: 500; }

    /* DNA check — five ✓ rows */
    .dna-row { display: grid; grid-template-columns: 16px 100px 1fr; gap: var(--space-sm); align-items: start; font-size: var(--font-size-caption); line-height: 1.45; }
    .dna-row__mark { color: var(--color-success); font-weight: 900; }
    .dna-row__mark--revise { color: #b3261e; }
    .dna-row__k { color: var(--color-text-primary); font-weight: 700; }
    .dna-row__v { color: var(--color-text-secondary); }

    /* Voice four-beat */
    .fourbeat { display: grid; grid-template-columns: 1fr 1fr; gap: var(--space-sm); }
    .fourbeat__cell { background: var(--color-surface-secondary); border-radius: var(--radius-sm); padding: var(--space-sm); }
    .fourbeat__n { font-size: 10px; font-weight: 800; letter-spacing: 0.08em; text-transform: uppercase; color: var(--color-action-primary); margin-bottom: 2px; }
    .fourbeat__t { font-size: var(--font-size-caption); color: var(--color-text-primary); line-height: 1.4; }

    /* Density gauge */
    .gauge { display: flex; flex-direction: column; gap: var(--space-sm); }
    .gauge__row { display: grid; grid-template-columns: 70px 1fr 56px; gap: var(--space-sm); align-items: center; font-size: var(--font-size-caption); }
    .gauge__k { color: var(--color-text-secondary); }
    .gauge__track { height: 6px; border-radius: var(--shape-pill); background: var(--color-surface-secondary); overflow: hidden; }
    .gauge__fill { height: 100%; border-radius: var(--shape-pill); }
    .gauge__fill--ok   { background: var(--color-success); }
    .gauge__fill--warn { background: #e6a008; }
    .gauge__fill--over { background: #b3261e; }
    .gauge__v { text-align: right; font-variant-numeric: tabular-nums; color: var(--color-text-primary); font-weight: 600; }
    .gauge__v--over { color: #b3261e; }

    /* Cross-modal anchor match */
    .crossmodal { display: flex; flex-direction: column; gap: var(--space-sm); }
    .crossmodal__pair { display: grid; grid-template-columns: 1fr 20px 1fr; gap: var(--space-xs); align-items: center; }
    .crossmodal__side { background: var(--color-surface-secondary); border-radius: var(--radius-sm); padding: var(--space-sm); font-size: var(--font-size-caption); }
    .crossmodal__side em { font-style: normal; display: block; font-size: 9px; text-transform: uppercase; letter-spacing: 0.06em; color: var(--color-text-tertiary); margin-bottom: 2px; }
    .crossmodal__eq { text-align: center; color: var(--color-success); font-weight: 900; }
    .crossmodal__line { font-size: var(--font-size-caption); color: var(--color-text-secondary); line-height: 1.45; }

    /* Memory used */
    .mem-row { display: flex; justify-content: space-between; gap: var(--space-sm); font-size: var(--font-size-caption); padding: 4px 0; border-bottom: 0.5px solid var(--color-border-default); }
    .mem-row:last-child { border-bottom: 0; }

    .mem-silent { font-size: var(--font-size-caption); color: var(--color-text-secondary); line-height: 1.45; margin-top: var(--space-sm); }
    .mem-silent strong { color: var(--color-text-primary); }

    .inv-group { font-size: var(--font-size-caption); line-height: 1.5; }
    .inv-group + .inv-group { margin-top: var(--space-sm); }
    .inv-group__h { font-size: 10px; font-weight: 800; text-transform: uppercase; letter-spacing: 0.06em; margin-bottom: 2px; }
    .inv-group--drop .inv-group__h { color: #b3261e; }
    .inv-group--lift .inv-group__h { color: var(--color-success); }

    /* Forbidden hits */
    .forbid { display: flex; align-items: center; gap: var(--space-sm); }
    .forbid__count { font-size: 22px; font-weight: 900; line-height: 1; }
    .forbid__count--ok { color: var(--color-success); }
    .forbid__count--bad { color: #b3261e; }
    .forbid__label { font-size: var(--font-size-caption); color: var(--color-text-secondary); line-height: 1.4; }

    /* Cinematic arc */
    .arc-row { display: grid; grid-template-columns: 96px 1fr; gap: var(--space-sm); font-size: var(--font-size-caption); padding: 4px 0; }
    .arc-row__k { color: var(--color-text-secondary); }
    .arc-row__v { color: var(--color-text-primary); font-weight: 500; }

    /* Try this in Live button */
    .try-live-btn {
      font-family: inherit;
      font-size: 12px;
      font-weight: 700;
      color: var(--color-action-primary);
      background: var(--color-action-primary-surface);
      border: 0;
      border-radius: var(--shape-pill);
      padding: 8px 14px;
      cursor: pointer;
      margin: 0 0 var(--space-lg);
      transition: background 120ms ease;
    }
    .try-live-btn:hover { background: rgba(116,66,228,0.12); }

    .refs { display: flex; flex-wrap: wrap; gap: 4px; }
    .refs a { font-size: 11px; color: var(--color-action-primary); text-decoration: none; padding: 2px 8px; border: 0.5px solid var(--color-border-default); border-radius: var(--shape-pill); }

       status banners, scoreboard.
       ======================================================================== */
    .turn__surface-tag {
      align-self: flex-start;
      font-size: 9px; font-weight: 800; letter-spacing: 0.08em; text-transform: uppercase;
      color: var(--color-text-tertiary);
      margin: 2px 0 -6px;
    }
    .turn--user + .turn__surface-tag,
    .turn__surface-tag.is-user { align-self: flex-end; }
    .turn--voice {
      align-self: flex-start;
      width: 100%;
      display: flex; gap: 8px; align-items: flex-start;
      background: var(--color-action-primary-surface);
      border-radius: 4px 18px 18px 18px;
      padding: 12px 14px;
      font-size: 15px; line-height: 1.4; color: var(--text-high);
    }
    .turn--voice .turn__speaker { flex-shrink: 0; width: 18px; height: 18px; color: var(--color-action-primary); margin-top: 1px; }
    .turn--voice .turn__speaker svg { width: 18px; height: 18px; }
    .beat-tag {
      align-self: flex-start;
      font-size: 9px; font-weight: 800; letter-spacing: 0.08em; text-transform: uppercase;
      color: var(--color-action-primary);
      background: var(--color-action-primary-surface);
      border-radius: var(--shape-pill);
      padding: 2px 8px;
      margin: 2px 0 -6px;

    .frame-tension { display: flex; flex-direction: column; gap: 8px; width: 100%; }
    .frame-tension__col {
      border-radius: var(--radius-md);
      padding: 12px 14px;

    .frame-tension__col--bad  .frame-tension__eb { color: #b3261e; }
    .frame-tension__col--good .frame-tension__eb { color: var(--color-action-primary); }
    .frame-tension__quote { font-size: 14px; line-height: 1.45; color: var(--text-high); }
    .turn-attachment .validator-banner { margin: 0; }
    /* Chat-surface primitives carry their own side gutters; zero them inside the
       transcript so they sit flush at the full 324px content width. */
    .turn-attachment .collection,
    .turn-attachment .timeline,
    .turn-attachment .tracker,
    .turn-attachment .confirm,
    .turn-attachment .chips-prompt,
    .turn-attachment .filter-chip-bar,

    .turn-attachment .confirm { padding: var(--space-lg); }
    .turn-attachment .detail-sheet { padding: 8px 16px 16px; box-shadow: none; border: 1px solid var(--color-border-default); border-radius: var(--radius-lg); }
    .turn-attachment .player { padding: 4px 0; }
    .turn-attachment .catalog-card__media { font-size: 30px; }
    .turn-attachment + .turn-attachment { margin-top: 8px; }
    .catalog-card--anchor .catalog-card__media { box-shadow: 0 0 0 2px var(--color-action-primary); }
    .catalog-card--anchor .catalog-card__title { color: var(--color-action-primary); }
    .att-caption { font-size: 11px; color: var(--color-text-tertiary); margin-top: 6px; }
    .validator-banner--ok {
      background: #e8f7f0; border-color: #c8ecdd; color: #0a7a52;
    }
    .validator-banner--warn {
      background: #fdecc8; border-color: #f6d488; color: #92560a;

    .helpline-card__row:last-child { border-bottom: 0; }
    .helpline-card__row b { color: var(--color-text-primary); }
    .helpline-card__note { font-size: var(--font-size-caption); color: var(--color-text-secondary); line-height: 1.45; }
    .score-head { font-size: 11px; font-weight: 800; text-transform: uppercase; letter-spacing: 0.06em; color: var(--color-action-primary); padding: 0 var(--space-lg) var(--space-xs); }

    @media (max-width: 720px) {
      body { padding-left: 0; padding-right: 0; }
      .page__title-block,

      }
      .frame { width: 100%; max-width: 380px; }
      .stage { width: 100%; max-width: 380px; }
    }

    const FORBIDDEN = [

    function forbiddenHits(text) {
      const t = text || '';
      const hits = [];
      FORBIDDEN.forEach(re => { const m = t.match(re); if (m) hits.push(m[0]); });
      return hits;

    /* Merge metadata into the original specimens (new specimens already carry
       their fields inline, so the spread is a no-op for them). */
    SPECIMENS.forEach(s => { if (SPECIMEN_META[s.id]) Object.assign(s, SPECIMEN_META[s.id]); });

    /* ========================================================================
       RENDERING
       ======================================================================== */
    function el(tag, attrs, children) {
      const node = document.createElement(tag);
      if (attrs) {
        for (const k in attrs) {
          if (k === 'class') node.className = attrs[k];
          else if (k === 'text') node.textContent = attrs[k];
          else if (k === 'html') node.innerHTML = attrs[k];
          else node.setAttribute(k, attrs[k]);
        }
      }
      if (children) children.forEach(c => c && node.appendChild(c));
      return node;
    }

    function renderBrand() {
      const a = el('a', { class: 'toc-brand', href: 'index.html' });
      const img = el('img', { src: 'assets/logo.svg', alt: 'JBIQ', class: 'toc-brand__mark', width: '28', height: '28' });
      const name = el('div', { class: 'toc-brand__name', text: 'JBIQ' });
      a.appendChild(img); a.appendChild(name);
      return a;
    }

    // Picker axis state — "by moment" (the original grouping) / "by chapter"
    // (1–14) / "by vertical". Carried in the URL hash as <axis>/<id>.
    let currentAxis = 'moment';
    const AXES = [
      { id: 'moment', label: 'By moment' },
      { id: 'chapter', label: 'By chapter' },
      { id: 'vertical', label: 'By vertical' },
    ];
    const visitedChapters = new Set();
    let pickerMount, counterMount, pickerQuery = '';

    function renderHeader() {
      const block = el('div', { class: 'page__title-block' });
      block.appendChild(renderBrand());

      const inner = el('div');
      inner.appendChild(el('h1', { class: 'page__title', text: 'Conversation Playground' }));
      inner.appendChild(el('p', {
        class: 'page__subtitle',
        text: 'Every chapter of the JBIQ Voice Playbook, on the surface — pick a moment, chapter, or vertical.',
      }));
      const link1 = el('p', { class: 'page__canonical-link' });
      link1.appendChild(el('a', { href: 'voice-playbook.html', text: 'Open the voice playbook →' }));
      inner.appendChild(link1);
      block.appendChild(inner);

      // Axis toggle.
      const toggle = el('div', { class: 'axis-toggle', role: 'tablist', 'aria-label': 'Group specimens by' });
      AXES.forEach(a => {
        const b = el('button', { class: 'axis-toggle__btn', type: 'button', 'data-axis': a.id, 'aria-pressed': String(a.id === currentAxis), text: a.label });
        b.addEventListener('click', () => setAxis(a.id));
        toggle.appendChild(b);
      });
      block.appendChild(toggle);

      // Acceptance counter.
      counterMount = el('div', { class: 'picker__counter' });
      block.appendChild(counterMount);

      // Filter box — searches label + id across the active grouping.
      const filter = el('input', { class: 'picker-filter', type: 'search', placeholder: 'Filter specimens…', 'aria-label': 'Filter specimens' });
      filter.addEventListener('input', () => filterPicker(filter.value));
      block.appendChild(filter);

      pickerMount = renderPicker(currentAxis);
      block.appendChild(pickerMount);
      updateCounter();
      return block;
    }

    // Hide picker buttons / groups that don't match the filter query.
    function filterPicker(q) {
      pickerQuery = (q != null ? q : pickerQuery).trim().toLowerCase();
      if (!pickerMount) return;
      pickerMount.querySelectorAll('.picker__group').forEach(g => {
        let anyVisible = false;
        g.querySelectorAll('.picker__btn').forEach(btn => {
          const id = btn.getAttribute('data-id') || '';
          const txt = (btn.textContent + ' ' + id).toLowerCase();
          const show = id === LIVE_ID || !pickerQuery || txt.includes(pickerQuery);
          btn.style.display = show ? '' : 'none';
          if (show && id !== LIVE_ID) anyVisible = true;
        });
        // Keep the live group always; hide others with no matches.
        const isLiveGroup = !!g.querySelector('.picker__btn[data-id="' + LIVE_ID + '"]');
        g.style.display = (isLiveGroup || anyVisible) ? '' : 'none';
      });
    }

    // Build the grouped specimen list for the active axis.
    function pickerGroups(axis) {
      const groups = [];
      const byKey = {};
      const push = (key, s) => { if (!byKey[key]) { byKey[key] = []; groups.push({ key, items: byKey[key] }); } byKey[key].push(s); };
      if (axis === 'chapter') {
        const sorted = [...SPECIMENS].sort((a, b) => (a.chapter || 99) - (b.chapter || 99));
        sorted.forEach(s => push('Ch. ' + (s.chapter || '?') + ' · ' + (CHAPTER_TITLES[s.chapter] || 'Other'), s));
      } else if (axis === 'vertical') {
        [...SPECIMENS].sort((a, b) => (a.vertical || 'zzz').localeCompare(b.vertical || 'zzz'))
          .forEach(s => push(s.vertical || 'Other', s));
      } else {
        SPECIMENS.forEach(s => push(s.group || 'Other', s));
      }
      return groups;
    }

    function renderPicker(axis) {
      const picker = el('nav', { class: 'picker', 'aria-label': 'Specimens' });

      // Live mode — its own group at the top of the nav.
      const liveGroup = el('div', { class: 'picker__group' });
      liveGroup.appendChild(el('div', { class: 'picker__group-label', text: 'Test the skill' }));
      const liveBtn = el('button', { class: 'picker__btn', type: 'button', 'data-id': LIVE_ID, 'aria-pressed': 'false', text: 'Try it live' });
      liveBtn.addEventListener('click', () => selectSpecimen(LIVE_ID, true));
      liveGroup.appendChild(liveBtn);
      picker.appendChild(liveGroup);

      pickerGroups(axis).forEach(group => {
        const g = el('div', { class: 'picker__group' });
        g.appendChild(el('div', { class: 'picker__group-label', text: group.key }));
        group.items.forEach(s => {
          const btn = el('button', {
            class: 'picker__btn', type: 'button', 'data-id': s.id,
            'aria-pressed': String(s.id === currentId),
            text: (axis === 'moment' ? s.label : (s.label + ' · ' + (s.vertical || ''))).replace(/ · $/, ''),
          });
          if (s.lintFail) btn.title = 'Lint warning — see console';
          btn.addEventListener('click', () => selectSpecimen(s.id, true));
          g.appendChild(btn);
        });
        picker.appendChild(g);
      });
      return picker;
    }

    function setAxis(axis) {
      if (axis === currentAxis) return;
      currentAxis = axis;
      document.querySelectorAll('.axis-toggle__btn').forEach(b => b.setAttribute('aria-pressed', String(b.getAttribute('data-axis') === axis)));
      const fresh = renderPicker(axis);
      pickerMount.replaceWith(fresh);
      pickerMount = fresh;
      pickerButtons = Array.from(document.querySelectorAll('.picker__btn'));
      if (pickerQuery) filterPicker(pickerQuery);
      if (currentId) setHash(currentId);
    }

    function updateCounter() {
      if (!counterMount) return;
      const total = Object.keys(CHAPTER_TITLES).length;
      counterMount.innerHTML = '';
      counterMount.appendChild(el('span', { html: 'Chapters seen <strong>' + visitedChapters.size + '/' + total + '</strong>' }));
    }

    const ICON_SPEAKER = '<svg viewBox="0 0 20 20" fill="none"><path d="M4 8v4h3l4 3V5L7 8H4z" fill="currentColor"/><path d="M14 7a4 4 0 010 6" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></svg>';

    function renderTurn(turn) {
      const frag = document.createDocumentFragment();
      if (turn.beat) frag.appendChild(el('div', { class: 'beat-tag', text: turn.beat }));
      if (turn.surfaceTag) frag.appendChild(el('div', { class: 'turn__surface-tag' + (turn.from === 'user' ? ' is-user' : ''), text: turn.surfaceTag }));
      if (turn.voice) {
        const b = el('div', { class: 'turn turn--voice' });
        b.appendChild(el('span', { class: 'turn__speaker', 'aria-hidden': 'true', html: ICON_SPEAKER }));
        b.appendChild(el('div', { html: turn.text }));
        frag.appendChild(b);
      } else {
        frag.appendChild(el('div', { class: 'turn turn--' + turn.from, html: turn.text }));
      }
      return frag;
    }

    // ── Attachment renderers — one per manifest primitive (Ch. 11 §5) ────────
    function attWrap(node, caption) {
      const wrap = el('div', { class: 'turn-attachment turn-attachment--jbiq' });
      if (node) wrap.appendChild(node);
      if (caption) wrap.appendChild(el('div', { class: 'att-caption', text: caption }));
      return wrap;
    }
    function cardMedia(c) {
      const m = el('div', { class: 'catalog-card__media' });
      if (c.img) m.style.backgroundImage = "url('" + c.img + "')";
      else if (c.emoji) m.textContent = c.emoji;
      if (c.badge) m.appendChild(el('div', { class: 'catalog-card__badge', text: c.badge }));
      return m;
    }
    function brandRow(b, cls) {
      const row = el('div', { class: cls + '__brand' });
      if (b.logo) row.appendChild(el('span', { class: cls + '__brand-logo', style: "background-image:url('" + b.logo + "')" }));
      row.appendChild(el('span', { class: cls + '__brand-name', text: b.name }));
      return row;
    }

    function receiptAtt(att) {
      const receipt = el('div', { class: 'receipt' });
      if (att.partner) {
        const p = el('div', { class: 'receipt-partner' });
        if (att.partner.logo) p.appendChild(el('span', { class: 'receipt-partner-logo', style: "background-image:url('" + att.partner.logo + "')" }));
        p.appendChild(el('span', { class: 'receipt-partner-name', text: att.partner.name }));
        receipt.appendChild(p);
      }
      const banner = el('div', { class: 'receipt-banner' });
      banner.appendChild(el('div', { class: 'receipt-check', text: '✓' }));
      const text = el('div');
      text.appendChild(el('div', { class: 'receipt-title', text: att.title }));
      if (att.sub) text.appendChild(el('div', { class: 'receipt-sub', text: att.sub }));
      banner.appendChild(text);
      receipt.appendChild(banner);
      (att.lines || []).forEach(l => {
        const row = el('div', { class: 'receipt-line' + (l.total ? ' receipt-total' : '') });
        row.appendChild(el('span', { text: l.label }));
        row.appendChild(el('span', { text: l.value }));
        receipt.appendChild(row);
      });
      return attWrap(receipt, att.caption);
    }

    function discoveryAtt(att) {
      const frag = el('div');
      if (att.subject) {
        const sh = el('div', { class: 'subject-header' });
        if (att.subject.partner) {
          const pr = el('div', { class: 'subject-header__partner' });
          pr.appendChild(el('span', { class: 'subject-header__partner-name', text: 'via ' + att.subject.partner }));
          sh.appendChild(pr);
        }
        sh.appendChild(el('div', { class: 'subject-header__title', text: att.subject.title }));
        if (att.subject.subtitle) sh.appendChild(el('div', { class: 'subject-header__subtitle', text: att.subject.subtitle }));
        frag.appendChild(sh);
        frag.appendChild(el('div', { style: 'height:10px' }));
      }
      const col = el('div', { class: 'collection collection--' + (att.layout || 'carousel') });
      (att.cards || []).forEach(c => {
        const card = el('div', { class: 'catalog-card' + (c.anchor ? ' catalog-card--anchor' : '') });
        card.appendChild(cardMedia(c));
        const content = el('div', { class: 'catalog-card__content' });
        content.appendChild(el('div', { class: 'catalog-card__title', text: c.title }));
        if (c.brand) content.appendChild(brandRow(c.brand, 'catalog-card'));
        if (c.tags) content.appendChild(el('div', { class: 'catalog-card__tags', text: c.tags }));
        const meta = el('div', { class: 'catalog-card__meta' });
        if (c.price) meta.appendChild(el('span', { class: 'catalog-card__price', text: c.price }));
        if (c.rating) meta.appendChild(el('span', { html: '<span class="catalog-card__rating-value">★ ' + escapeHtml(c.rating) + '</span>' }));
        if (meta.childNodes.length) content.appendChild(meta);
        card.appendChild(content);
        col.appendChild(card);
      });
      frag.appendChild(col);
      if (att.chips) {
        if (att.chipsPrompt) frag.appendChild(el('div', { class: 'chips-prompt', text: att.chipsPrompt, style: 'padding-top:12px' }));
        const bar = el('div', { class: 'filter-chip-bar', style: 'padding-top:8px' });
        att.chips.forEach(ch => bar.appendChild(el('button', { class: 'filter-chip' + (ch.selected ? ' filter-chip--selected' : ''), type: 'button', text: ch.label })));
        frag.appendChild(bar);

      if (att.edge) {
        const e = el('div', { class: 'edge-affordance', style: 'padding-top:10px' });
        e.appendChild(el('button', { class: 'edge-affordance__btn', type: 'button', text: att.edge }));
        frag.appendChild(e);
      }
      return attWrap(frag, att.caption);
    }

    function comparisonAtt(att) {
      const table = el('div', { class: 'compare-table' });
      const scroller = el('div', { class: 'compare-table__scroller' });
      const labels = el('div', { class: 'compare-table__labels' });
      labels.appendChild(el('div', { class: 'compare-table__header-label', text: att.compareLabel || 'Compare' }));
      (att.rows || []).forEach(r => labels.appendChild(el('div', { class: 'compare-table__label-cell', text: r.label })));
      labels.appendChild(el('div', { class: 'compare-table__label-cell', text: '' }));
      scroller.appendChild(labels);
      const opts = el('div', { class: 'compare-table__options' });
      (att.options || []).forEach((o, oi) => {
        const opt = el('div', { class: 'compare-table__option' + (o.recommended ? ' compare-table__option--recommended' : '') });
        const head = el('div', { class: 'compare-table__header-cell' });
        if (o.badge) head.appendChild(el('div', { class: 'compare-table__option-badge', text: o.badge }));
        head.appendChild(el('div', { class: 'compare-table__option-title', text: o.title }));
        if (o.sub) head.appendChild(el('div', { class: 'compare-table__option-subtitle', text: o.sub }));
        opt.appendChild(head);
        (att.rows || []).forEach(r => {
          const best = (r.best || []).indexOf(oi) !== -1;
          opt.appendChild(el('div', { class: 'compare-table__cell' + (best ? ' compare-table__cell--best' : ''), text: r.values[oi] }));
        });
        const ctaCell = el('div', { class: 'compare-table__cell compare-table__cell--cta' });
        ctaCell.appendChild(el('button', { class: 'compare-table__cta', type: 'button', text: o.cta || 'Choose' }));
        opt.appendChild(ctaCell);
        opts.appendChild(opt);
      });
      scroller.appendChild(opts);
      table.appendChild(scroller);
      return attWrap(table, att.caption);

    function slotpickerAtt(att) {

      return attWrap(frag, att.caption);

    const LIVE_ID = 'try-live';
    let liveHistory = [];

    function renderLiveTurn(from, text) {

    async function sendLiveMessage(text, transcriptEl, inputEl) {
      text = (text || '').trim();
      if (!text || liveBusy) return;
      liveBusy = true;

      transcriptEl.appendChild(renderLiveTurn('user', text));
      liveHistory.push({ role: 'user', content: text });
      inputEl.value = '';
      inputEl.closest('.frame__input')?.classList.remove('frame__input--has-text');

      const thinking = renderThinking();
      transcriptEl.appendChild(thinking);
      transcriptEl.scrollTop = transcriptEl.scrollHeight;

      try {
        const res = await fetch('/api/chat', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            messages: liveHistory,
            userProfile: { city: 'Mumbai', country: 'India' },
          }),
        });
        const data = await res.json().catch(() => ({}));
        thinking.remove();
        const reply = (data && data.text) ? data.text : "I didn't quite catch that — mind sending it again?";
        transcriptEl.appendChild(renderLiveTurn('jbiq', reply));
        if (data && data.text) liveHistory.push({ role: 'assistant', content: reply });
        updateLiveChecks(reply);
      } catch (e) {
        thinking.remove();
        transcriptEl.appendChild(renderLiveTurn('jbiq', "That didn't go through — the connection dropped on my end. Send it once more and I'll pick it right up."));
      } finally {
        liveBusy = false;
        transcriptEl.scrollTop = transcriptEl.scrollHeight;
        inputEl.focus();
      }
    }

    function renderLiveFrame() {
      // Fresh slate each time live mode mounts — keep visible transcript and
      // the history sent to /api/chat in sync.
      liveHistory = [];
      const frame = el('div', { class: 'frame', role: 'group', 'aria-label': 'JBIQ live conversation' });

      const transcript = el('div', { class: 'frame__transcript' });

      // Header — back chevron + title + new-chat icon (resets the conversation).
      const header = el('div', { class: 'frame__header' });
      const start = el('div', { class: 'frame__header-start' });
      start.appendChild(el('button', { class: 'frame__back', type: 'button', 'aria-label': 'Back', html: ICON_BACK }));
      start.appendChild(el('span', { class: 'frame__title', text: 'Try it live' }));
      header.appendChild(start);
      const reset = el('button', { class: 'frame__new-chat', type: 'button', 'aria-label': 'New chat', html: ICON_NEW_CHAT });
      reset.addEventListener('click', () => {
        liveHistory = [];
        transcript.innerHTML = '';
        const f = frame.querySelector('.frame__input-field');
        if (f) f.focus();
      });
      header.appendChild(reset);
      frame.appendChild(header);

      frame.appendChild(transcript);

      // Input bar — + / editable pill with inline send arrow / Speak button.
      // Mirrors index.html text mode: Speak collapses and the send arrow
      // appears inside the pill once there's text.
      const input = el('div', { class: 'frame__input' });
      input.appendChild(el('button', { class: 'frame__add', type: 'button', 'aria-label': 'Add', html: ICON_ADD }));

      const pill = el('div', { class: 'frame__input-pill frame__input-pill--live' });
      const field = el('input', { class: 'frame__input-field', type: 'text', 'aria-label': 'Message JBIQ', placeholder: 'Ask anything' });
      const send = el('button', { class: 'frame__send', type: 'button', 'aria-label': 'Send', html: ICON_SEND });
      pill.appendChild(field);
      pill.appendChild(send);
      pill.addEventListener('click', () => field.focus());

      const fire = () => sendLiveMessage(field.value, transcript, field);
      send.addEventListener('click', fire);
      field.addEventListener('keydown', (e) => {
        if (e.key === 'Enter') { e.preventDefault(); fire(); }
      });
      field.addEventListener('input', () => {
        input.classList.toggle('frame__input--has-text', field.value.trim().length > 0);
      });

      input.appendChild(pill);
      input.appendChild(speakButton());
      frame.appendChild(input);

      // Consume a seed from a specimen's "Try this in Live →" button.
      if (liveSeed) {
        field.value = liveSeed; liveSeed = null;
        input.classList.add('frame__input--has-text');
        setTimeout(() => field.focus(), 0);
      }

      return frame;
    }

    function guessIntent(t) {
      t = (t || '').toLowerCase();
      if (/i can'?t|don'?t know|sorry|unable|won'?t be able/.test(t)) return 'Failure / refusal';
      if (/here are|a few options|options:|choose from|recommend|pick one|some options/.test(t)) return 'Multi-Option';
      if (/(recharge|\bpay\b|confirm|tap the confirmation|complete your|\bbook\b|switch to)/.test(t) && /₹|\?|confirm|tap|complete/.test(t)) return 'Single-Path (confirm)';
      if (/\?\s*$/.test(t.trim())) return 'Clarification';
      return 'Informational';

    const LANG_LABEL = { en: 'English', hinglish: 'Hinglish', hi: 'हिन्दी', ta: 'தமிழ்', te: 'తెలుగు', bn: 'বাংলা', mr: 'मराठी', bho: 'भोजपुरी' };

      if (s.commitmentLevel) wrap.appendChild(badge('Commit: ' + s.commitmentLevel, 'commit'));
      if (s.auth) wrap.appendChild(badge('Auth: ' + s.auth, 'auth'));

      if (s.surface && s.surface !== 'chat') wrap.appendChild(badge(s.surface, 'surface'));
      if (s.resolutionStrategy) wrap.appendChild(badge(s.resolutionStrategy, 'strategy'));
      if (s.failClass) wrap.appendChild(badge(s.failClass, 'fail'));

      if (s.language && s.language !== 'en') wrap.appendChild(badge(LANG_LABEL[s.language] || s.language));

    }

    function intentPanel(s) {
      const { panel, body } = panelEl('Intent + anatomy', s.intentShape, null);
      body.classList.add('panel-rows');
      const a = s.anatomy || {};
      const slots = [
        ['Slot 1 · Context', a.context], ['Slot 2 · Primary', a.primary || s.manifestPrimitive],
        ['Slot 3 · Refine', a.refine], ['Slot 4 · Edge', a.edge],
      ];
      slots.forEach(([k, v]) => {
        if (!v) return;
        const row = el('div', { class: 'kv' });
        row.appendChild(el('span', { class: 'kv__k', text: k }));
        row.appendChild(el('span', { class: 'kv__v', text: v }));
        body.appendChild(row);
      });
      if (!body.childNodes.length) body.appendChild(el('div', { text: s.intentShape + ' shape — see the surface for the anatomy in action.' }));
      return panel;
    }

    function fourbeatPanel(v) {
      const { panel, body } = panelEl('Voice four-beat', 'Ch.5 §2', null);
      const grid = el('div', { class: 'fourbeat' });
      [['1 · Outcome', v.outcome], ['2 · Anchor', v.anchor], ['3 · Shape', v.shape], ['4 · Pivot', v.pivot]].forEach(([n, t]) => {
        const cell = el('div', { class: 'fourbeat__cell' });
        cell.appendChild(el('div', { class: 'fourbeat__n', text: n }));
        cell.appendChild(el('div', { class: 'fourbeat__t', text: t || '—' }));
        grid.appendChild(cell);
      });
      body.appendChild(grid);
      return panel;
    }

    function densityPanel(d) {
      const { panel, body } = panelEl('Density gauge', 'Ch.5 §3', null);
      const gauge = el('div', { class: 'gauge' });
      [['Words', d.words, DENSITY_MAX.words], ['Attributes', d.attributes, DENSITY_MAX.attributes], ['Items', d.items, DENSITY_MAX.items]].forEach(([k, n, max]) => {
        const st = densityState(n, max);
        const row = el('div', { class: 'gauge__row' });
        row.appendChild(el('span', { class: 'gauge__k', text: k }));
        const track = el('div', { class: 'gauge__track' });
        track.appendChild(el('div', { class: 'gauge__fill gauge__fill--' + st, style: 'width:' + Math.min(100, (n / max) * 100) + '%' }));
        row.appendChild(track);
        row.appendChild(el('span', { class: 'gauge__v' + (st === 'over' ? ' gauge__v--over' : ''), text: n + ' / ' + max }));
        gauge.appendChild(row);
      });
      body.appendChild(gauge);
      return panel;
    }

    function crossModalPanel(c) {
      const { panel, body } = panelEl('Anchors match', 'Ch.10 §5', null);
      const wrap = el('div', { class: 'crossmodal' });
      const pair = el('div', { class: 'crossmodal__pair' });
      const v = el('div', { class: 'crossmodal__side', html: '<em>Voice anchor</em>' + escapeHtml(c.voiceAnchor || '') });
      const eq = el('div', { class: 'crossmodal__eq', text: '✓' });
      const sc = el('div', { class: 'crossmodal__side', html: '<em>Screen anchor</em>' + escapeHtml(c.screenAnchor || '') });
      pair.appendChild(v); pair.appendChild(eq); pair.appendChild(sc);
      wrap.appendChild(pair);
      if (c.handoffLine) wrap.appendChild(el('div', { class: 'crossmodal__line', html: '<strong>Handoff:</strong> "' + escapeHtml(c.handoffLine) + '"' }));
      body.appendChild(wrap);
      return panel;
    }

    function cinematicArcPanel(a) {
      const { panel, body } = panelEl('Cinematic arc', 'Ch.5 §12', null);
      [['Persona', a.persona], ['Pace', a.pace], ['Recap at', a.recapAt], ['Micro-pivot at', a.microPivotAt], ['Length', a.length]].forEach(([k, v]) => {
        if (!v) return;
        const row = el('div', { class: 'arc-row' });
        row.appendChild(el('span', { class: 'arc-row__k', text: k }));
        row.appendChild(el('span', { class: 'arc-row__v', text: v }));
        body.appendChild(row);
      });
      return panel;
    }

    function memoryPanel(m) {
      const { panel, body } = panelEl('What JBIQ inferred', 'Ch.7 §3', null);
      (m.surfaced || []).forEach(it => {
        const row = el('div', { class: 'mem-row' });
        row.appendChild(el('span', { text: it.inference }));
        row.appendChild(el('span', { class: 'mem-row__conf', text: it.confidence }));
        body.appendChild(row);
      });
      if (m.silent) body.appendChild(el('div', { class: 'mem-silent', html: '<strong>Stayed silent:</strong> ' + escapeHtml(m.silent) }));
      return panel;
    }

    function commitPanel(s) {
      const { panel, body } = panelEl('Commitment + auth', s.commitmentLevel || '—', null);
      body.classList.add('panel-rows');
      const rows = [
        ['Level', s.commitmentLevel], ['Auth floor', s.auth],
        ['Reversibility', typeof s.reversibilityWindow === 'number' ? s.reversibilityWindow + 's undo window' : null],
        ['Consent', s.consent], ['Compliance Ledger', s.ledger || (s.commitmentLevel ? 'Written before dispatch ✓' : null)],
      ];
      rows.forEach(([k, v]) => {
        if (!v) return;
        const row = el('div', { class: 'kv' });
        row.appendChild(el('span', { class: 'kv__k', text: k }));
        row.appendChild(el('span', { class: 'kv__v', text: v }));
        body.appendChild(row);
      });
      return panel;
    }

    function partnerPanel(s) {
      const { panel, body } = panelEl('Partner & ranking', s.resolutionStrategy || 'Partner', null);
      body.classList.add('panel-rows');
      const p = s.partner || {};
      const rows = [
        ['Partner', p.name], ['Attribution', p.attributionLine], ['Why this?', p.whyThis || s.whyThis],
        ['Strategy', s.resolutionStrategy],
      ];
      rows.forEach(([k, v]) => {
        if (!v) return;
        const row = el('div', { class: 'kv' });
        row.appendChild(el('span', { class: 'kv__k', text: k }));
        row.appendChild(el('span', { class: 'kv__v', text: v }));
        body.appendChild(row);
      });
      return panel;
    }

    function sensitivePanel(inv) {
      const { panel, body } = panelEl('Sensitive inversion', 'Ch.12', 'avoid');
      const drop = el('div', { class: 'inv-group inv-group--drop' });
      drop.appendChild(el('div', { class: 'inv-group__h', text: 'Dropped' }));
      drop.appendChild(el('div', { text: (inv.dropped || []).join(' · ') }));
      const lift = el('div', { class: 'inv-group inv-group--lift' });
      lift.appendChild(el('div', { class: 'inv-group__h', text: 'Elevated' }));
      lift.appendChild(el('div', { text: (inv.elevated || []).join(' · ') }));
      body.appendChild(drop); body.appendChild(lift);
      return panel;
    }

    function forbiddenPanel(s) {
      const hits = forbiddenHits(specimenReplyText(s));
      const { panel, body } = panelEl('Forbidden-hit detector', 'Ch.13', null);
      const wrap = el('div', { class: 'forbid' });
      wrap.appendChild(el('span', { class: 'forbid__count ' + (hits.length ? 'forbid__count--bad' : 'forbid__count--ok'), text: String(hits.length) }));
      wrap.appendChild(el('span', { class: 'forbid__label', text: hits.length ? 'Hits: ' + hits.join(', ') : 'Ch. 13 regex set ran on every reply — clean.' }));
      body.appendChild(wrap);
      return panel;
    }

    function refsPanel(refs) {
      const { panel, body } = panelEl('Source', 'Playbook', null);
      const wrap = el('div', { class: 'refs' });
      refs.forEach(r => wrap.appendChild(el('a', { href: 'voice-playbook.html', text: r })));
      body.appendChild(wrap);
      return panel;
    }

    function escapeHtml(str) {
      return String(str || '').replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
    }

    function renderCaption(specimen) {
      const aside = el('aside', { class: 'state-caption', 'aria-live': 'polite' });
      aside.appendChild(el('div', { class: 'state-caption__eyebrow', text: specimen.eyebrow }));
      aside.appendChild(el('p', { class: 'state-caption__title', text: specimen.title }));

      const badges = renderBadges(specimen);
      if (badges) aside.appendChild(badges);

      const firstUser = (specimen.transcript || []).find(t => t.from === 'user' && t.text);
      if (firstUser) {
        const tryBtn = el('button', { class: 'try-live-btn', type: 'button', text: 'Try this in Live →' });
        tryBtn.addEventListener('click', () => { liveSeed = firstUser.text; selectSpecimen(LIVE_ID, true); });
        aside.appendChild(tryBtn);
      }

      const panels = el('div', { class: 'state-caption__panels' });
      (specimen.principles || []).forEach((p, i) => {
        panels.appendChild(renderPanel(p.name, p.why, String(i + 1).padStart(2, '0')));
      });
      if (specimen.avoid) panels.appendChild(renderPanel('Avoid', specimen.avoid, "Don't", 'avoid'));
      if (specimen.intentShape) panels.appendChild(intentPanel(specimen));
      if (specimen.voiceBeats) panels.appendChild(fourbeatPanel(specimen.voiceBeats));
      if (specimen.density) panels.appendChild(densityPanel(specimen.density));
      if (specimen.crossModal) panels.appendChild(crossModalPanel(specimen.crossModal));
      if (specimen.cinematicArc) panels.appendChild(cinematicArcPanel(specimen.cinematicArc));
      if (specimen.memoryUsed) panels.appendChild(memoryPanel(specimen.memoryUsed));
      if (specimen.commitmentLevel || specimen.auth || typeof specimen.reversibilityWindow === 'number' || specimen.consent) panels.appendChild(commitPanel(specimen));
      if (specimen.partner || specimen.resolutionStrategy || specimen.whyThis) panels.appendChild(partnerPanel(specimen));
      if (specimen.sensitiveInversion) panels.appendChild(sensitivePanel(specimen.sensitiveInversion));
      if (specimen.dna) panels.appendChild(dnaPanel(specimen.dna));
      panels.appendChild(forbiddenPanel(specimen));
      if (specimen.metric) panels.appendChild(renderPanel('Acceptance metric', specimen.metric, 'Ch.14'));
      if (specimen.references) panels.appendChild(refsPanel(specimen.references));

      aside.appendChild(panels);
      return aside;
    }

    /* ========================================================================
       LINT — runs on load. Flags forbidden phrases, voice over-density, and
       sensitive-mode tone breaks. Console warnings + a red flag on the picker.
       ======================================================================== */
    const EMOJI_RE = /[\u{1F000}-\u{1FAFF}\u{2600}-\u{27BF}\u{1F1E6}-\u{1F1FF}\u{2190}-\u{21FF}\u{2B00}-\u{2BFF}]/u;
    function lintSpecimen(s) {
      const reply = specimenReplyText(s);
      const warns = [];
      const hits = forbiddenHits(reply);
      if (hits.length) warns.push('forbidden phrase(s): ' + hits.join(', '));
      if (s.density) {
        if (s.density.words > DENSITY_MAX.words) warns.push('voice over-density: ' + s.density.words + ' words');
        if (s.density.attributes > DENSITY_MAX.attributes) warns.push('voice over-density: ' + s.density.attributes + ' attributes');
        if (s.density.items > DENSITY_MAX.items) warns.push('voice over-density: ' + s.density.items + ' items');
      }
      if (s.senseMode === 'sensitive') {
        if (EMOJI_RE.test(reply)) warns.push('emoji in a sensitive reply');
        if (/we dream big/i.test(reply)) warns.push('"we dream big" horizon-raise in a sensitive reply');
      }
      if (warns.length) { s.lintFail = true; console.warn('[lint] ' + s.id + ' — ' + warns.join('; ')); }
      return warns;
    }

    /* ========================================================================
       STATE
       ======================================================================== */
    let currentId = null;
    let stageMount, captionMount, pickerButtons;

    function resolveId(id) {
      if (id === LIVE_ID) return LIVE_ID;
      return (SPECIMENS.find(x => x.id === id) || SPECIMENS[0]).id;
    }
    function renderStageFor(id) {
      return id === LIVE_ID ? renderLiveStage() : renderStage(SPECIMENS.find(s => s.id === id));
    }
    function renderCaptionFor(id) {
      return id === LIVE_ID ? renderLiveCaption() : renderCaption(SPECIMENS.find(s => s.id === id));
    }

    // Hash format: #<axis>/<id>  (legacy #<id> still resolves).
    function parseHash() {
      const raw = decodeURIComponent(location.hash.slice(1));
      if (!raw) return { axis: null, id: null };
      const parts = raw.split('/');
      if (parts.length === 2 && AXES.some(a => a.id === parts[0])) return { axis: parts[0], id: parts[1] };
      return { axis: null, id: raw };
    }
    function setHash(id) {
      const next = currentAxis + '/' + id;
      if (location.hash.slice(1) !== next) history.replaceState(null, '', '#' + next);
    }

    function selectSpecimen(id, updateHash) {
      const resolved = resolveId(id);
      currentId = resolved;

      const newStage = renderStageFor(resolved);
      stageMount.replaceWith(newStage);
      stageMount = newStage;

      const newCaption = renderCaptionFor(resolved);
      captionMount.replaceWith(newCaption);
      captionMount = newCaption;

      pickerButtons.forEach(btn => {
        btn.setAttribute('aria-pressed', btn.getAttribute('data-id') === resolved ? 'true' : 'false');
      });

      // Acceptance tracking — mark the chapter as seen.
      const spec = SPECIMENS.find(s => s.id === resolved);
      if (spec && spec.chapter) { visitedChapters.add(spec.chapter); updateCounter(); }

      if (updateHash) setHash(resolved);
    }

    function init() {
      const root = document.getElementById('root');

      // Run the linter once on load — warnings to console, red flag on the picker.
      SPECIMENS.forEach(lintSpecimen);

      const parsed = parseHash();
      if (parsed.axis) currentAxis = parsed.axis;

      const page = el('div', { class: 'page' });
      page.appendChild(renderHeader());

      const initialId = resolveId(parsed.id || SPECIMENS[0].id);
      currentId = initialId;

      stageMount = renderStageFor(initialId);
      page.appendChild(stageMount);

      captionMount = renderCaptionFor(initialId);
      page.appendChild(captionMount);

      root.appendChild(page);

      pickerButtons = Array.from(document.querySelectorAll('.picker__btn'));
      pickerButtons.forEach(btn => {
        btn.setAttribute('aria-pressed', btn.getAttribute('data-id') === initialId ? 'true' : 'false');
      });
      const initSpec = SPECIMENS.find(s => s.id === initialId);
      if (initSpec && initSpec.chapter) visitedChapters.add(initSpec.chapter);
      updateCounter();

      window.addEventListener('hashchange', () => {
        const p = parseHash();
        if (p.axis && p.axis !== currentAxis) setAxis(p.axis);
        if (p.id && p.id !== currentId) selectSpecimen(p.id, false);
      });

      window.addEventListener('keydown', (e) => {
        if (e.target && /^(INPUT|TEXTAREA|SELECT)$/.test(e.target.tagName)) return;
        if (e.key !== 'ArrowDown' && e.key !== 'ArrowUp') return;
        // Walk the visible (axis-grouped) order so arrows match the picker.
        const order = pickerGroups(currentAxis).flatMap(g => g.items.map(s => s.id));
        const i = order.indexOf(currentId);
        if (i < 0) return;
        const next = e.key === 'ArrowDown' ? Math.min(i + 1, order.length - 1) : Math.max(i - 1, 0);
        if (order[next] !== currentId) { selectSpecimen(order[next], true); e.preventDefault(); }
      });
    }

    init();
  </script>
</body>
</html>
